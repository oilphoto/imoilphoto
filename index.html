<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'M OIL PHOTO - ตารางเช็ควันว่างช่างภาพ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Anuphan', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <div class="max-w-4xl mx-auto px-4 py-8 space-y-8">
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="inline-block bg-amber-500 text-slate-950 p-3 rounded-2xl font-bold text-2xl shadow-lg shadow-amber-500/20 mb-2">
                <i class="fa-solid fa-camera"></i>
            </div>
            <h1 class="text-3xl font-black tracking-wider bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">I'M OIL PHOTO</h1>
            <p class="text-sm text-slate-400">🌐 ระบบเช็ค "วันว่างจองคิว" ช่างภาพออกกองถ่ายภาพออนไลน์</p>
        </div>

        <!-- Calendar Card -->
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800 pb-4 gap-3">
                <h2 id="calendarMonthTitle" class="font-bold text-xl text-slate-200">พ.ศ. ---</h2>
                <div class="flex items-center gap-3 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs">
                    <select id="globalYearSelect" onchange="filterJobsByMonth()" class="bg-transparent text-slate-200 font-semibold focus:outline-none cursor-pointer">
                        <option value="2026">พ.ศ. 2569</option>
                        <option value="2027">พ.ศ. 2570</option>
                    </select>
                    <span class="text-slate-700">|</span>
                    <select id="globalMonthSelect" onchange="filterJobsByMonth()" class="bg-transparent text-slate-200 font-semibold focus:outline-none cursor-pointer">
                        <option value="01">มกราคม</option><option value="02">กุมภาพันธ์</option><option value="03">มีนาคม</option><option value="04">เมษายน</option><option value="05">พฤษภาคม</option><option value="06">มิถุนายน</option><option value="07">กรกฎาคม</option><option value="08">สิงหาคม</option><option value="09">กันยายน</option><option value="10">ตุลาคม</option><option value="11">พฤศจิกายน</option><option value="12">ธันวาคม</option>
                    </select>
                </div>
            </div>

            <!-- Badges -->
            <div class="flex gap-4 text-xs font-medium bg-slate-950/40 p-3 rounded-xl border border-slate-800/60">
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-500 shadow-sm"></span> ✅ ว่างจองคิวได้</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-rose-500 shadow-md"></span> ❌ คิวงานเต็มแล้ว</span>
            </div>

            <!-- Grid -->
            <div class="grid grid-cols-7 gap-2 text-center text-xs font-bold text-slate-400 mb-2">
                <div class="text-rose-400">อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div class="text-sky-400">ส</div>
            </div>
            <div id="calendarGrid" class="grid grid-cols-7 gap-2 text-center text-sm font-semibold"></div>
        </div>

        <!-- Info Footer -->
        <div class="text-center text-xs text-slate-500 border-t border-slate-900 pt-6">
            <p>📸 สนใจติดต่อจองคิวถ่ายภาพ ยินดีให้บริการบันทึกความทรงจำร่างทองในวันสำคัญครับ</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ihvtdaehpjmqwazpaghp.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_Eeu7tjWSA8qMcaBOVpCX2A_dAn3yNGL';
        let supabaseClient = null; let allJobs = []; let filteredJobs = [];

        async function initPublicSystem() {
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                const timeData = new Date();
                document.getElementById('globalYearSelect').value = timeData.getFullYear().toString();
                document.getElementById('globalMonthSelect').value = (timeData.getMonth() + 1).toString().padStart(2, '0');
                await loadJobsFromCloud();
            } catch (err) { console.error(err); }
        }

        async function loadJobsFromCloud() {
            let { data, error } = await supabaseClient.from('jobs').select('date');
            if (!error) { allJobs = data || []; filterJobsByMonth(); }
        }

        function filterJobsByMonth() {
            const selectedYear = document.getElementById('globalYearSelect').value;
            const selectedMonth = document.getElementById('globalMonthSelect').value; 
            filteredJobs = allJobs.filter(job => job.date && job.date.split('-')[0] === selectedYear && job.date.split('-')[1] === selectedMonth);
            
            const monthNames = { "01": "มกราคม", "02": "กุมภาพันธ์", "03": "มีนาคม", "04": "เมษายน", "05": "พฤษภาคม", "06": "มิถุนายน", "07": "กรกฎาคม", "08": "สิงหาคม", "09": "กันยายน", "10": "ตุลาคม", "11": "พฤศจิกายน", "12": "ธันวาคม" };
            document.getElementById('calendarMonthTitle').innerText = `${monthNames[selectedMonth]} พ.ศ. ${parseInt(selectedYear) + 543}`;
            renderCalendarGrid();
        }

        function renderCalendarGrid() {
            const grid = document.getElementById('calendarGrid'); grid.innerHTML = '';
            const selectedYear = document.getElementById('globalYearSelect').value;
            const selectedMonth = document.getElementById('globalMonthSelect').value;
            const offset = new Date(parseInt(selectedYear), parseInt(selectedMonth) - 1, 1).getDay();
            const totalDays = new Date(parseInt(selectedYear), parseInt(selectedMonth), 0).getDate();

            for (let i = 0; i < offset; i++) {
                let emptyDiv = document.createElement('div');
                emptyDiv.className = "p-3 bg-slate-950/20 text-slate-800 rounded-lg select-none";
                emptyDiv.innerText = "-"; grid.appendChild(emptyDiv);
            }
            for (let day = 1; day <= totalDays; day++) {
                let dayStr = `${selectedYear}-${selectedMonth}-${day.toString().padStart(2, '0')}`; 
                let dayJobs = filteredJobs.filter(j => j.date === dayStr); 
                let dayDiv = document.createElement('div');
                
                if (dayJobs.length > 0) {
                    dayDiv.className = "p-3 bg-rose-950/60 text-rose-400 rounded-xl border border-rose-500/20 flex flex-col items-center select-none shadow-md";
                    dayDiv.innerHTML = `<span>${day}</span><span class="text-[9px] font-bold mt-0.5 opacity-80">❌ เต็ม</span>`;
                } else {
                    dayDiv.className = "p-3 bg-emerald-950/60 text-emerald-400 rounded-xl border border-emerald-500/20 flex flex-col items-center select-none shadow-md";
                    dayDiv.innerHTML = `<span>${day}</span><span class="text-[9px] font-bold mt-0.5 opacity-80">✅ ว่าง</span>`;
                }
                grid.appendChild(dayDiv);
            }
        }
        window.onload = initPublicSystem;
    </script>
</body>
</html>
